[graph]
all-features = true
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-linux-android",
    "aarch64-apple-ios",
    "wasm32-unknown-unknown",
]

# License policy for the dependency graph of the targets above (cargo-deny 0.20 schema).
# Only license terms that are actually required by a crate are allowed. Where a crate
# offers a permissive alternative in an OR expression (e.g. "MIT OR Apache-2.0 OR
# LGPL-2.1-or-later", "Apache-2.0 OR GPL-2.0-only", "Unlicense OR MIT"), cargo-deny
# accepts the permissive alternative, so copyleft alternatives are not listed here.
# Workspace crates are MIT OR Apache-2.0 (see [workspace.package] in Cargo.toml).
[licenses]
allow = [
    # Dual-license default for most crates (e.g. wgpu, winit, cosmic-text, taffy).
    "MIT",
    # Dual-license default and required by crates such as ab_glyph, winit, accesskit_winit.
    "Apache-2.0",
    # Required by unicode-ident (AND-combined with MIT OR Apache-2.0).
    "Unicode-3.0",
    # Required by tiny-skia, tiny-skia-path (BSD-3-Clause, single license).
    "BSD-3-Clause",
    # Required by arrayref (BSD-2-Clause, single license).
    "BSD-2-Clause",
    # Required by clipboard-win and error-code (BSL-1.0, single license).
    "BSL-1.0",
    # Required by foldhash and slotmap (Zlib, single license).
    "Zlib",
    # Required by libloading (ISC, single license).
    "ISC",
    # Required by hexf-parse (CC0-1.0, public-domain dedication, single license).
    "CC0-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
unused-allowed-source = "allow"

