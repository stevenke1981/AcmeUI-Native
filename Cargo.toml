[workspace]
resolver = "2"
members = [
	"crates/acme-core", "crates/acme-platform", "crates/acme-render-wgpu",
	"crates/acme-layout", "crates/acme-text", "crates/acme-render-cpu", "crates/acme-accessibility",
	"crates/acme-theme", "crates/acme-animation", "crates/acme-style", "crates/acme-widgets", "crates/acme-textinput", "crates/acme-devtools", "crates/acme-ui",
	"apps/gallery", "apps/acme-gallery", "apps/playground", "apps/benchmark"
]
default-members = ["apps/gallery"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stevenke1981/AcmeUI-Native"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
winit = "0.30"
wgpu = "29"
softbuffer = "=0.4.8"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
taffy = "0.9"
cosmic-text = "0.14"
fontdb = "0.23"
unicode-segmentation = "1"
arboard = "3"
accesskit = "0.21"
accesskit_winit = "0.29"
smallvec = "1"
slotmap = "1"
bitflags = "2"

# Internal crates: path for the workspace, version for packaging (bump together
# with [workspace.package].version; see docs/guides/RELEASE.md).
acme-core = { path = "crates/acme-core", version = "0.2.0" }
acme-platform = { path = "crates/acme-platform", version = "0.2.0" }
acme-render-wgpu = { path = "crates/acme-render-wgpu", version = "0.2.0" }
acme-layout = { path = "crates/acme-layout", version = "0.2.0" }
acme-text = { path = "crates/acme-text", version = "0.2.0" }
acme-render-cpu = { path = "crates/acme-render-cpu", version = "0.2.0" }
acme-accessibility = { path = "crates/acme-accessibility", version = "0.2.0" }
acme-theme = { path = "crates/acme-theme", version = "0.2.0" }
acme-animation = { path = "crates/acme-animation", version = "0.2.0" }
acme-style = { path = "crates/acme-style", version = "0.2.0" }
acme-widgets = { path = "crates/acme-widgets", version = "0.2.0" }
acme-textinput = { path = "crates/acme-textinput", version = "0.2.0" }
acme-devtools = { path = "crates/acme-devtools", version = "0.2.0" }
acme-ui = { path = "crates/acme-ui", version = "0.2.0" }

[profile.dev]
incremental = true
debug = 1
codegen-units = 256

[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
