name: CPU lockfile repair (temporary)
on:
  push:
    branches: [feature/cpu-renderer-software-fallback]
    paths: [.github/workflows/cpu-lock-repair.yml]
permissions:
  contents: read
jobs:
  repair:
    if: github.repository == 'stevenke1981/AcmeUI-Native' && github.event_name == 'push' && github.ref == 'refs/heads/feature/cpu-renderer-software-fallback'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - name: Resolve only missing lockfile entries using Cargo
        run: cargo check -p acme-render-cpu
      - name: Verify locked CPU tests
        run: cargo test --locked -p acme-render-cpu
      - name: Commit only Cargo.lock without replacing concurrent work
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          branch=feature/cpu-renderer-software-fallback
          test "$(git diff --name-only)" = Cargo.lock
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Cargo.lock
          git commit -m 'fix(build): synchronize CPU backend dependencies in Cargo.lock'
          git push origin HEAD:refs/heads/$branch
