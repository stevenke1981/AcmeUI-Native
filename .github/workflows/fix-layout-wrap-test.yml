name: Fix platform-neutral layout wrapping test

on:
  pull_request:
    paths:
      - .github/workflows/fix-layout-wrap-test.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/native-platform-adaptation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-platform-adaptation
      - name: Replace system-font-dependent layout test
        shell: python
        run: |
          from pathlib import Path

          path = Path("crates/acme-layout/src/lib.rs")
          text = path.read_text(encoding="utf-8")
          start = text.index("    #[test]\n    fn narrow_cjk_text_wraps_to_more_lines()")
          end = text.index("\n    }\n}", start) + len("\n    }")
          replacement = '''    #[test]
          fn constrained_text_wraps_to_more_lines() {
              let mut fonts = FontSystem::new();
              // Keep this integration test independent of optional system font
              // coverage. Script-specific fallback is tested in acme-text.
              let text = "AcmeUI native components wrap consistently across platforms";
              let style = TextStyle {
                  font_size: 16.0,
                  line_height: 20.0,
                  ..TextStyle::default()
              };
              let narrow = fonts.shape(
                  text,
                  &style,
                  TextConstraints {
                      max_width: Some(100.0),
                      wrap: TextWrap::WordOrGlyph,
                  },
                  1.0,
              );
              let wide = fonts.shape(
                  text,
                  &style,
                  TextConstraints {
                      max_width: Some(1_000.0),
                      wrap: TextWrap::WordOrGlyph,
                  },
                  1.0,
              );
              assert!(
                  narrow.line_count > wide.line_count,
                  "expected narrow line count ({}) > wide line count ({})",
                  narrow.line_count,
                  wide.line_count,
              );
              assert!(
                  narrow.height > wide.height,
                  "expected narrow height ({}) > wide height ({})",
                  narrow.height,
                  wide.height,
              );
          }'''
          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
      - name: Commit source fix and remove this one-time workflow
        run: |
          rm .github/workflows/fix-layout-wrap-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/acme-layout/src/lib.rs .github/workflows/fix-layout-wrap-test.yml
          git commit -m "test(layout): remove system-font dependency"
          git push origin HEAD:agent/native-platform-adaptation
