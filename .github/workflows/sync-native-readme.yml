name: Sync native README metadata

on:
  push:
    branches: [agent/native-platform-adaptation]
    paths:
      - .github/workflows/sync-native-readme.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-platform-adaptation
      - name: Update English and Traditional Chinese platform metadata
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path("README.md"): {
                  "- **Rust** 1.85+ (MSRV, edition 2024)":
                      "- **Rust** 1.88+ (MSRV, edition 2024; pinned by `rust-toolchain.toml`)",
                  "- **Windows 10/11** (primary target; Linux/macOS secondary)":
                      "- **Desktop targets:** Windows 10/11, macOS, and Linux",
                  "- A GPU with **DirectX 12** or **Vulkan** support":
                      "- A backend supported by wgpu: **DirectX 12**, **Metal**, **Vulkan**, or **WebGPU**",
                  "Platform presets are also available: `windows11_template(\"Dashboard\")` and\n`ubuntu25_template(\"Dashboard\")`.\n":
                      "Platform presets are also available: `windows11_template(\"Dashboard\")` and\n`ubuntu25_template(\"Dashboard\")`. Use `native_template(\"Dashboard\")`,\n`native_theme(...)`, and `native_button(...)` when the same component tree should\nautomatically adopt Windows, macOS, Linux, Android, iOS, or Web defaults.\n",
              },
              Path("README-zhtw.md"): {
                  "- **Rust** 1.85+（MSRV，edition 2024）":
                      "- **Rust** 1.88+（MSRV、edition 2024；由 `rust-toolchain.toml` 固定）",
                  "- **Windows 10/11**（主要目標；Linux/macOS 次要）":
                      "- **桌面目標：** Windows 10/11、macOS 與 Linux",
                  "- 支援 **DirectX 12** 或 **Vulkan** 的 GPU":
                      "- wgpu 支援的後端：**DirectX 12**、**Metal**、**Vulkan** 或 **WebGPU**",
              },
          }

          for path, changes in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in changes.items():
                  if old not in text:
                      raise SystemExit(f"Expected README text not found in {path}: {old!r}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
      - name: Commit README updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README-zhtw.md
          git diff --cached --quiet || git commit -m "docs: align README with native cross-platform support"
          git push origin HEAD:agent/native-platform-adaptation
