name: CPU renderer evidence
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: cpu-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  headless:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: CPU pixel and regression tests without a display
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target/cpu-evidence
          cargo test --locked -p acme-render-cpu 2>&1 | tee target/cpu-evidence/tests.log
      - name: CPU crate formatting
        run: cargo fmt -p acme-render-cpu -- --check
      - name: CPU crate Clippy
        run: cargo clippy --locked -p acme-render-cpu --all-targets --no-deps -- -D warnings
      - name: Capture exact tested source
        if: always()
        shell: bash
        run: |
          mkdir -p target/cpu-evidence
          git rev-parse HEAD > target/cpu-evidence/tested-sha.txt
          rustc --version --verbose > target/cpu-evidence/toolchain.txt
          git archive --format=zip HEAD -o target/cpu-evidence/source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-evidence-${{ github.run_id }}
          path: target/cpu-evidence/
          retention-days: 14
          if-no-files-found: error
