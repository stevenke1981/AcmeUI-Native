name: CI
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting of changed Rust files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python scripts/check_changed_rustfmt.py
      - run: cargo check --workspace --all-targets
      - run: cargo check -p acme-ui --all-targets --all-features
      - name: Check Clippy diagnostics in changed Rust files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python scripts/check_changed_clippy.py
      - run: cargo test --workspace
      - run: cargo test -p acme-ui --all-features

  cross-target:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: wasm32-unknown-unknown
            label: WebAssembly
          - os: ubuntu-latest
            target: aarch64-linux-android
            label: Android ARM64
          - os: macos-latest
            target: aarch64-apple-ios
            label: iOS ARM64
    name: cross-target (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: >-
          cargo check -p acme-ui
          --lib
          --all-features
          --target ${{ matrix.target }}

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - run: cargo install --locked cargo-deny cargo-audit
      - run: cargo deny check bans sources
      - name: Audit runtime dependency graph
        # wayland-scanner uses quick-xml only inside a build-time proc macro to
        # parse trusted protocol XML shipped by Wayland crates. The upstream
        # quick-xml 0.41 scanner is not release-compatible with Wayland 0.31 yet.
        # Remove both exceptions when issue #3 is resolved.
        run: >-
          cargo audit
          --ignore RUSTSEC-2026-0194
          --ignore RUSTSEC-2026-0195
