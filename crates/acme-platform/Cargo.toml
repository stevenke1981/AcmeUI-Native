[package]
name = "acme-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Windows-first winit runtime with the Application trait and GPU/CPU renderer selection for AcmeUI Native"
repository.workspace = true
rust-version.workspace = true
keywords = ["acmeui", "gui", "winit"]
categories = ["gui"]

[features]
default = ["cpu-renderer"]
cpu-renderer = ["dep:acme-render-cpu", "dep:softbuffer"]

[dependencies]
winit.workspace = true
thiserror.workspace = true
pollster.workspace = true
tracing.workspace = true
arboard.workspace = true
acme-core.workspace = true
acme-render-wgpu.workspace = true
acme-render-cpu = { workspace = true, optional = true }
softbuffer = { workspace = true, optional = true }
