[package]
name = "acme-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "High-level component library for AcmeUI Native with optional foundations, inputs, layout, overlay and feature families"
repository.workspace = true
rust-version.workspace = true
keywords = ["acmeui", "gui", "components"]
categories = ["gui"]

[features]
default = ["foundations", "inputs", "layout", "overlay"]
foundations = []
inputs = []
layout = []
overlay = []
charts = []
desktop = []
mobile = ["foundations"]
browser = []
full = ["foundations", "inputs", "layout", "overlay", "charts", "desktop", "mobile", "browser"]

[dependencies]
acme-core = { path = "../acme-core" }
acme-widgets = { path = "../acme-widgets" }
acme-layout = { path = "../acme-layout" }
acme-theme = { path = "../acme-theme" }
acme-text = { path = "../acme-text" }
